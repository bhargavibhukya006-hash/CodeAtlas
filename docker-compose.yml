
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeatlas-postgres
    restart: always
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: codeatlas_secret
      POSTGRES_DB: codeatlas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas -d codeatlas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
